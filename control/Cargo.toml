[package]
name = "spoti-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Portable Spoti control protocol; optional Unix socket transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
